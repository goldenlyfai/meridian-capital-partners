name: Daily Data Refresh

on:
  schedule:
    # 10:00 AM UTC = 6:00 AM ET (before market open), weekdays only
    - cron: "0 10 * * 1-5"
  workflow_dispatch:  # allow manual trigger from GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: dashboard/requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r dashboard/requirements-pipeline.txt

      - name: Run data refresh
        working-directory: dashboard
        run: python3 run_data.py --no-filings --no-13f
        timeout-minutes: 40

      - name: Run scoring
        working-directory: dashboard
        run: python3 run_scoring.py
        timeout-minutes: 15
